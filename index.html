<style>
:root{
  /* LISTA OFF — laranja (nomes --yellow mantidos p/ compatibilidade) */
  --yellow:#FF5C00;
  --yellow-soft:#FFE7D6;
  --yellow-tint:#FFF1E6;
  --ink:#120D08;
  --bg:#FFF8F2;
  --surface:#FFFFFF;
  --surface-2:#FFF3EA;

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;

h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.4px}

/* ===== LAYOUT SHELL ===== */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);background:var(--ink);border-right:1px solid #1c1c1a;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;

}
.sidebar .brand{padding:24px 22px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #1f1f1d}
.sidebar .brand .mark{font-family:'Space Grotesk';font-weight:700;font-size:21px;color:#fff;letter-spacing:-.5px}
.sidebar .brand .mark .off{background:var(--yellow);color:var(--ink);padding:1px 9px;border-radius:7px;margin-left:5px}
.nav{padding:14px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
.nav a{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
  color:#9a9a90;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:.15s;
}
.nav a:hover{background:#1a1a18;color:#fff}
.nav a.active{background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 #000}
.nav a .ic{width:20px;text-align:center;font-size:16px}
.nav .sep{height:1px;background:#242422;margin:10px 6px}

/* ===== COMPONENTES ===== */

.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--yellow)}
.btn-green{background:var(--yellow);color:var(--ink)}
.btn-ghost{background:var(--surface);color:var(--ink)}
.btn-danger{background:#fff;color:var(--danger)}
.btn-sm{padding:7px 13px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:18px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}

.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:2px solid var(--ink);border-radius:10px;padding:8px 8px 8px 12px;margin-top:10px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--yellow);padding:13px 22px;border-radius:10px;font-weight:700;font-family:'Space Grotesk';font-size:14px;transition:.3s;z-index:999;box-shadow:0 10px 30px -8px rgba(0,0,0,.3)}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}

.login-wrap{max-width:400px;margin:60px auto;padding:0 20px}

/* ===== PÚBLICO: tela preta "tá na lista" ===== */
body.pub-mode{background:var(--ink)}
body.pub-mode .sidebar,body.pub-mode .topbar-m,body.pub-mode .backdrop{display:none!important}

.pub-stage{min-height:100vh;background:var(--ink);color:#fff;padding:0}
.pub-wrap{max-width:460px;margin:0 auto;padding:32px 22px 60px}

.pub-card{background:#141412;border:2px solid var(--yellow);border-radius:16px;padding:22px;margin-top:26px;box-shadow:6px 6px 0 var(--yellow)}
.pub-card label{color:#9a9a90}
.pub-card input,.pub-card select{background:#0e0e0c;border:2px solid #3a3a36;color:#fff}
.pub-card input::placeholder{color:#5a5a52}
.pub-card input:focus,.pub-card select:focus{border-color:var(--yellow);box-shadow:3px 3px 0 var(--yellow)}
.pub-done{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:30px 22px;text-align:center;margin-top:26px;box-shadow:7px 7px 0 var(--ink)}

/* ===== MOBILE ===== */

<script>
/* =================== UTIL =================== */
const $ = s => document.querySelector(s);
const app = $("#app");
let DB, FB;

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function sexLabel(s){return s==="M"?"Masculino":s==="F"?"Feminino":"Outro";}
function sexClass(s){return s==="M"?"sex-m":s==="F"?"sex-f":"sex-o";}
function fmtBRL(v){return "R$ "+Number(v||0).toFixed(2).replace(".",",");}
function baseUrl(){return location.origin+location.pathname;}
function fmtData(d){return d?new Date(d+'T00:00').toLocaleDateString('pt-BR'):'sem data';}
function ordEvDocs(docs){return [...docs].sort((a,b)=>{const da=a.data().data||"",db=b.data().data||"";if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da>db?-1:da<db?1:0;});}

// senhas / whatsapp (definidos no topo do arquivo)
function toggleMenu(open){
  $("#sidebar").classList.toggle("open",open);
  $("#backdrop").classList.toggle("show",open);
}

/* =================== ROUTER =================== */
function route(){
  clearWatchers();
  if(window._clearListeners) window._clearListeners();
  toggleMenu(false);
  document.body.classList.remove("pub-mode");
  const p = new URLSearchParams(location.search);
  const v = p.get("v");
  // público (link de cadastro)
  if(p.get("lista") && !p.get("admin")) return renderPublic(p.get("ev"), p.get("lista"));
  if(v==="portaria") return guardPortaria();
  if(v==="parceiro") return renderParceiro();
  if(v==="login") return renderLogin();
  if(v==="escolher") return guardAdmin(()=>renderEscolher());
  if(v==="geral") return guardAdmin(()=>renderAdminGeral());
  if(v==="painel"||v==="admin"||v==="banco"||v==="relatorios" || (p.get("ev")&&!p.get("lista"))) return guardAdmin();
  return renderLanding();
}
function go(params){
  const u=new URL(location.href); u.search=new URLSearchParams(params).toString();
  history.pushState({},"",u); route();
}
window.addEventListener("popstate", route);
window.go=go; window.toggleMenu=toggleMenu;

/* ---- gerenciador de listeners (desinscreve ao trocar de tela) ---- */
let _watchers=[];
function watch(ref, cb){ const unsub=FB.onSnapshot(ref, cb); _watchers.push(unsub); return unsub; }
function clearWatchers(){ _watchers.forEach(u=>{try{u&&u()}catch(e){}}); _watchers=[]; }

/* =================== FIREBASE READY =================== */
let AUTH, CURRENT_USER=null, CURRENT_CONTA=null, _authReady=false;
function isAdminGeral(){ return CURRENT_USER && CURRENT_USER.email && CURRENT_USER.email.toLowerCase()===ADMIN_GERAL.toLowerCase(); }
function _ms(t){ if(!t) return 0; return t.seconds ? t.seconds*1000 : new Date(t).getTime(); }
function emTrial(){ const c=CURRENT_CONTA||{}; const t=_ms(c.trialAte); return t && t>Date.now(); }
// conta pode criar eventos? grátis, admin geral, assinatura ativa, ou em trial
function temPlanoAtivo(){
  if(!PAGAMENTO_ATIVO) return true; // pagamento desligado: tudo liberado
  const c=CURRENT_CONTA||{};
  if(c.gratis||isAdminGeral()) return true;
  if(emTrial()) return true;                         // em período de teste grátis
  if(!c.plano) return false;
  if(!c.planoAte) return true;                        // sem data = ativo (controlado pelo Stripe)
  return _ms(c.planoAte)>Date.now();
}
function diasRestantes(t){ const ms=_ms(t)-Date.now(); return ms>0?Math.ceil(ms/86400000):0; }
function planoLabel(){
  const c=CURRENT_CONTA||{};
  if(c.gratis) return "Cortesia ✦";
  if(emTrial()) return `Teste · faltam ${diasRestantes(c.trialAte)}d`;
  if(temPlanoAtivo()) return "LISTA OFF Pro";
  return "Sem plano";
}
function onFbReady(){
  FB=window._fb; DB=FB.db; AUTH=window._auth;
  if(firebaseConfig.apiKey==="COLE_AQUI"){
    document.querySelector(".shell").innerHTML=`<div class="content"><div class="card center"><h2>⚠️ Falta configurar o Firebase</h2><p class="muted" style="margin-top:8px">Cole a config do seu projeto Firebase no topo do arquivo (bloco PASSO 1) e suba de novo.</p></div></div>`;
    return;
  }
  // observa login/logout do dono
  AUTH.onAuthStateChanged(AUTH.auth, async(user)=>{
    CURRENT_USER=user||null; CURRENT_CONTA=null;
    if(user){
      // garante doc da conta
      const ref=FB.doc(DB,"contas",user.uid);
      const snap=await FB.getDoc(ref);
      if(!snap.exists()){
        await FB.setDoc(ref,{email:user.email,nome:user.displayName||"",plano:null,planoAte:null,gratis:false,criadoEm:FB.serverTimestamp()});
        CURRENT_CONTA={email:user.email,nome:user.displayName||"",plano:null,planoAte:null,gratis:false};
      } else CURRENT_CONTA=snap.data();
    }
    _authReady=true;
    route();
  });
}

async function reloadConta(){
  if(!CURRENT_USER) return;
  const snap=await FB.getDoc(FB.doc(DB,"contas",CURRENT_USER.uid));
  if(snap.exists()) CURRENT_CONTA=snap.data();
}

function lpLiveInit(){
  let list=[{n:"Amanda Reis",s:"f",d:true},{n:"Bruno Lima",s:"m",d:false},{n:"Carla Souza",s:"f",d:false}], sex="f";
  const ul=$("#lcUl"),emp=$("#lcEmpty"),inp=$("#lcIn"),bF=$("#lcBF"),bM=$("#lcBM"),add=$("#lcAdd"),cT=$("#lcT"),cF=$("#lcF"),cM=$("#lcM");
  if(!ul) return;
  const setSex=s=>{sex=s;bF.classList.toggle("on",s==="f");bM.classList.toggle("on",s==="m");};
  bF.onclick=()=>setSex("f");bM.onclick=()=>setSex("m");
  const esc2=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  function render(){
    list.sort((a,b)=>a.n.localeCompare(b.n,"pt"));
    ul.innerHTML="";emp.style.display=list.length?"none":"block";
    list.forEach(x=>{const li=document.createElement("li");if(x.d)li.className="done";
      li.innerHTML='<span class="dot '+x.s+'"></span><span class="nm">'+esc2(x.n)+'</span><button class="ck">✓</button>';
      li.querySelector(".ck").onclick=()=>{x.d=!x.d;render();};ul.appendChild(li);});
    const f=list.filter(x=>x.s==="f").length;cT.textContent=list.length;cF.textContent=f+"♀";cM.textContent=(list.length-f)+"♂";
  }
  function addN(){const v=inp.value.trim();if(v.length<2){inp.focus();return;}list.push({n:v,s:sex,d:false});inp.value="";render();inp.focus();}
  add.onclick=addN;inp.addEventListener("keydown",e=>{if(e.key==="Enter")addN();});
  render();
}

function renderLogin(){

  if(CURRENT_USER){ return go({v:'escolher'}); }
  showShell(false);
  let modo="login"; // ou "cadastro"
  const draw=()=>{
    app.innerHTML=`<div class="login-wrap">
      <button class="fab-back" onclick="go({})">← voltar</button>
      <div class="card">
        <div style="font-family:'Space Grotesk';font-weight:700;font-size:26px;margin-bottom:2px">LISTA<span style="background:var(--yellow);border:2px solid var(--ink);padding:0 7px;border-radius:7px;margin-left:5px;box-shadow:2px 2px 0 var(--ink)">OFF</span></div>
        <p class="muted" style="margin-bottom:14px">${modo==="login"?"Entre pra gerenciar seus rolês.":"Crie sua conta e comece a usar."}</p>
        ${modo==="cadastro"?`<label>Seu nome</label><input id="auNome" placeholder="Nome completo" autocomplete="name">`:""}
        <label>E-mail</label><input id="auEmail" type="email" placeholder="voce@email.com" autocomplete="email">
        <label>Senha</label><input id="auPw" type="password" placeholder="${modo==="cadastro"?"crie uma senha (mín. 6)":"sua senha"}" autocomplete="${modo==="cadastro"?"new-password":"current-password"}">
        <button class="btn btn-primary" style="width:100%;margin-top:18px" id="auBtn">${modo==="login"?"Entrar":"Criar conta →"}</button>
        ${modo==="login"?`<button class="fab-back" style="margin:14px 0 0" id="auReset">esqueci a senha</button>`:""}
        <div style="text-align:center;margin-top:16px;font-size:14px;color:var(--muted)">
          ${modo==="login"?`Não tem conta? <a style="color:var(--ink);font-weight:700;cursor:pointer" id="auSwap">Criar agora</a>`:`Já tem conta? <a style="color:var(--ink);font-weight:700;cursor:pointer" id="auSwap">Entrar</a>`}
        </div>
      </div></div>`;
    $("#auSwap").onclick=()=>{modo=modo==="login"?"cadastro":"login";draw();};
    const submit=async()=>{
      const email=($("#auEmail").value||"").trim(), pw=$("#auPw").value||"";
      if(!email||!email.includes("@")) return toast("Digite um e-mail válido");
      if(pw.length<6) return toast("Senha de no mínimo 6 caracteres");
      $("#auBtn").disabled=true; $("#auBtn").textContent="…";
      try{
        if(modo==="cadastro"){
          const nome=($("#auNome").value||"").trim();
          if(nome.length<2){$("#auBtn").disabled=false;$("#auBtn").textContent="Criar conta →";return toast("Digite seu nome");}
          const cred=await AUTH.createUserWithEmailAndPassword(AUTH.auth,email,pw);
          try{ await AUTH.updateProfile(cred.user,{displayName:nome}); }catch(e){}
          toast("Conta criada! 🎉");
          // onAuthStateChanged cuida do resto (cria doc e redireciona)
        }else{
          await AUTH.signInWithEmailAndPassword(AUTH.auth,email,pw);
          toast("Bem-vindo de volta 👋");
        }
        go({v:'escolher'});
      }catch(e){
        $("#auBtn").disabled=false; $("#auBtn").textContent=modo==="login"?"Entrar":"Criar conta →";
        toast(authErro(e));
      }
    };
    $("#auBtn").onclick=submit;
    $("#auPw").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
    const r=$("#auReset"); if(r) r.onclick=async()=>{
      const email=($("#auEmail").value||"").trim(); if(!email) return toast("Digite seu e-mail primeiro");
      try{ await AUTH.sendPasswordResetEmail(AUTH.auth,email); toast("Enviamos um link de recuperação pro seu e-mail"); }
      catch(e){ toast(authErro(e)); }
    };
  };
  draw();
}

function authErro(e){
  const c=(e&&e.code)||"";
  if(c.includes("email-already-in-use")) return "Esse e-mail já tem conta. Faça login.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "E-mail ou senha incorretos";
  if(c.includes("weak-password")) return "Senha muito fraca (mín. 6)";
  if(c.includes("invalid-email")) return "E-mail inválido";
  if(c.includes("too-many-requests")) return "Muitas tentativas. Tente mais tarde.";
  if(c.includes("network")) return "Sem conexão. Verifique a internet.";
  return "Erro: "+(e&&e.message||"tente de novo");
}

// classifica o status de uma conta: pago / trial / gratis / sem
function statusConta(c){
  if(c.gratis) return {k:"gratis", label:"Cortesia ✦", pill:"pill-amber"};
  const now=Date.now();
  const trialAte=c.trialAte?(c.trialAte.seconds?c.trialAte.seconds*1000:new Date(c.trialAte).getTime()):0;
  const planoAte=c.planoAte?(c.planoAte.seconds?c.planoAte.seconds*1000:new Date(c.planoAte).getTime()):0;
  if(c.plano && (!planoAte || planoAte>now)){
    if(trialAte && trialAte>now) return {k:"trial", label:"Em teste", pill:"pill-gray"};
    return {k:"pago", label:"Pagante 💳", pill:"pill-green"};
  }
  if(trialAte && trialAte>now) return {k:"trial", label:"Em teste", pill:"pill-gray"};
  return {k:"sem", label:"Sem plano", pill:"pill-gray"};
}

  app.innerHTML=`<h1 class="page-title">Admin Geral 👑</h1>
    <p class="muted" style="margin-bottom:16px">Visão geral das contas, assinaturas e receita. Libere cortesia pros seus próprios negócios.</p>
    <div id="agResumo" class="stat-grid" style="margin-bottom:18px"></div>
    <div class="search-box" style="margin-bottom:14px"><input id="agSearch" placeholder="buscar por e-mail ou nome…"></div>
    <div id="agList"><div class="loader">carregando contas…</div></div>`;
  const snap=await FB.getDocs(FB.collection(DB,"contas"));
  let all=snap.docs.map(d=>({uid:d.id,...d.data()}));
  all.sort((a,b)=>(a.email||"").localeCompare(b.email||""));
  // resumo
  let pagantes=0,trial=0,gratis=0,sem=0;
  all.forEach(c=>{const s=statusConta(c);if(s.k==="pago")pagantes++;else if(s.k==="trial")trial++;else if(s.k==="gratis")gratis++;else sem++;});
  const mrr=pagantes*PLANO.preco;
  $("#agResumo").innerHTML=`
    <div class="stat"><div class="n">${all.length}</div><div class="l">contas no total</div></div>
    <div class="stat" style="background:var(--yellow-tint)"><div class="n">${pagantes}</div><div class="l">pagantes 💳</div></div>
    <div class="stat"><div class="n">${trial}</div><div class="l">em teste grátis</div></div>
    <div class="stat"><div class="n">${fmtBRL(mrr)}</div><div class="l">receita/mês (MRR)</div></div>`;
  const draw=(f="")=>{
    const q=f.toLowerCase();
    const arr=all.filter(c=>(c.email||"").toLowerCase().includes(q)||(c.nome||"").toLowerCase().includes(q));
    if(!arr.length){$("#agList").innerHTML=`<div class="empty"><div class="ic">👥</div>Nenhuma conta.</div>`;return;}
    $("#agList").innerHTML=arr.map(c=>{
      const s=statusConta(c);
      return `<div class="card" style="margin-bottom:12px">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <div style="flex:1;min-width:160px">
          <div style="font-weight:700">${esc(c.nome||"(sem nome)")}</div>
          <div class="muted" style="font-size:13px">${esc(c.email||"")}</div>
        </div>
        <span class="pill ${s.pill}">${s.label}</span>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-ghost btn-sm" onclick="toggleGratis('${c.uid}',${c.gratis?'false':'true'})">${c.gratis?'tirar cortesia':'dar cortesia ✦'}</button>
      </div></div>`;}).join("");
  };
  draw(); $("#agSearch").oninput=e=>draw(e.target.value);
}
window.toggleGratis=async(uid,val)=>{
  await FB.updateDoc(FB.doc(DB,"contas",uid),{gratis:val});
  toast(val?"Cortesia liberada ✦":"Cortesia removida");
  if(CURRENT_USER&&CURRENT_USER.uid===uid) await reloadConta();
  renderAdminGeral();
};

/* =================== LOGIN (antigo, portaria) =================== */
function loginScreen(titulo, onOk){
  showShell(false);
  app.innerHTML=`<div class="login-wrap">
    <button class="fab-back" onclick="go({})">← voltar</button>
    <div class="card">
      <h2>${titulo}</h2>
      <label>Senha</label>
      <input id="pw" type="password" placeholder="senha de acesso">
      <button class="btn btn-primary" style="width:100%;margin-top:18px" id="logBtn">Entrar</button>
    </div></div>`;
  const t=()=>onOk($("#pw").value);
  $("#logBtn").onclick=t;
  $("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")t();});
}
function guardAdmin(then){
  if(!_authReady){ app.innerHTML=`<div class="loader">carregando…</div>`; return; }
  if(!CURRENT_USER){ return renderLogin(); }
  showShell(true);
  if(then) return then();
  return renderAdminRoute();
}
function guardPortaria(){
  if(sessionStorage.portOk==="1"){ showShell(true); return renderPortariaRoute(); }
  loginScreen("Portaria 🎟️",(pw)=>{if(pw===SENHA_PORTARIA||pw===SENHA_ADMIN){sessionStorage.portOk="1";showShell(true);renderPortariaRoute();}else toast("Senha incorreta");});
}
</script>
<script>
/* =================== ADMIN ROUTER =================== */
function renderAdminRoute(){
  const p=new URLSearchParams(location.search);
  if(p.get("v")==="painel") return PAGAMENTO_ATIVO ? renderPainel() : renderEventos();
  if(p.get("v")==="banco") return renderBanco();
  if(p.get("v")==="relatorios") return renderRelatorios();
  if(p.get("ev")) return renderEventoDetalhe(p.get("ev"));
  return renderEventos();
}
// o dono pode mexer neste evento? (admin geral mexe em tudo)
function podeEvento(evData){ return isAdminGeral() || !evData.ownerUid || evData.ownerUid===CURRENT_USER.uid; }

/* =================== EVENTOS (lista estilo VIPme) =================== */
function renderEventos(){
  renderSidebar("admin");
  app.innerHTML=`
    <h1 class="page-title">Eventos</h1>
    <div class="card">
      <h2 style="font-size:18px;margin-bottom:4px">Criar evento</h2>
      <p class="muted" style="margin-bottom:6px">Ex: Japa NK</p>
      <div class="row">
        <div><label>Nome do evento</label><input id="evNome" placeholder="Nome do evento"></div>
        <div><label>Data</label><input id="evData" type="date"></div>
      </div>
      <label>Local (opcional)</label>
      <input id="evLocal" placeholder="Ex: Seu Cupido Bar · Montes Claros">
      <label>Descrição (aparece no link de cadastro)</label>
      <textarea id="evDesc" placeholder="Ex: Sexta, a partir das 22h&#10;Open bar até meia-noite&#10;Aperte Enter para uma nova linha" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
      <button class="btn btn-primary" style="margin-top:16px" id="evCriar">+ Criar evento</button>
    </div>
    <div class="search-box" style="margin-bottom:16px"><input id="evBusca" placeholder="buscar evento…"></div>
    <div id="evLista"><div class="loader">carregando…</div></div>`;

  $("#evCriar").onclick=async()=>{
    const nome=$("#evNome").value.trim(),data=$("#evData").value,local=$("#evLocal").value.trim(),descricao=$("#evDesc").value.trim();
    if(!nome) return toast("Digite o nome do evento");
    await reloadConta();
    if(!temPlanoAtivo()){
      return openModal(`<h2>Precisa de um plano 💳</h2><p class="muted" style="margin:8px 0">Pra criar eventos você precisa de uma assinatura ativa. Com ela os eventos e listas são <b>ilimitados</b> — a partir de ${fmtBRL(4.90)}/mês no plano anual.</p><div class="row" style="margin-top:12px"><button class="btn btn-ghost" onclick="closeModal()">Agora não</button><button class="btn btn-primary" onclick="closeModal();go({v:'painel'})">Ver planos →</button></div>`);
    }
    $("#evCriar").disabled=true;
    try{
      await FB.addDoc(FB.collection(DB,"eventos"),{nome,data,local,descricao,ownerUid:CURRENT_USER.uid,criadoEm:FB.serverTimestamp()});
      $("#evNome").value="";$("#evData").value="";$("#evLocal").value="";$("#evDesc").value="";$("#evDesc").style.height="auto";
      toast("Evento criado! 🎉");
    }catch(e){ toast("Erro ao criar evento"); }
    $("#evCriar").disabled=false;
  };

  let allEv=[];
  const draw=(filtro="")=>{
    const f=filtro.toLowerCase();
    const arr=allEv.filter(e=>(e._d.nome||"").toLowerCase().includes(f));
    if(!arr.length){$("#evLista").innerHTML=`<div class="empty"><div class="ic">📅</div>Nenhum evento ${filtro?'encontrado':'ainda. Crie o primeiro!'}</div>`;return;}
    $("#evLista").innerHTML=arr.map(o=>{
      const e=o._d,c=o._cont;
      const pres=`${c.checkin}/${c.total}`;
      const atalho = (c.listas&&c.listas.length) ? `
          <div class="ev-listas" onclick="event.stopPropagation()">
            ${c.listas.map(l=>{
              const link=`${baseUrl()}?ev=${o.id}&lista=${l.id}`;
              return `<div class="ev-lista-row">
                <span class="ev-lista-nm">${esc(l.nome)}${l.valor>0?` <span class="ev-lista-val">${fmtBRL(l.valor)}</span>`:''} <span class="ev-lista-qtd">${l.qtd}</span></span>
                <button class="btn btn-ghost btn-sm" onclick="copyLinkVal('${link.replace(/'/g,"\\'")}')">🔗 copiar link</button>
              </div>`;
            }).join("")}
          </div>` : `<div class="ev-listas-vazio" onclick="event.stopPropagation()">Nenhuma lista criada ainda · <b>Gerenciar listas</b> pra criar</div>`;
      return `<div class="ev-card">
        <div class="body" onclick="go({ev:'${o.id}'})" style="cursor:pointer">
          <div class="date">${fmtData(e.data)}</div>
          <h3>${esc(e.nome)}</h3>
          ${e.local?`<div class="loc">📍 ${esc(e.local)}</div>`:''}
          <div class="meta">
            <span class="pill pill-green">Presentes: ${pres}</span>
            <span class="pill pill-gray">${c.f}♀ / ${c.m}♂${c.o?` / ${c.o}⚧`:''}</span>
          </div>
          ${atalho}
        </div>
        <div class="foot">
          <button class="btn btn-primary btn-sm" onclick="go({ev:'${o.id}'})">Gerenciar listas</button>
          <button class="btn btn-ghost btn-sm" onclick="editarEvento('${o.id}')">✏️ editar</button>
          <button class="btn btn-danger btn-sm" onclick="apagarEvento('${o.id}','${esc(e.nome).replace(/'/g,"\\'")}')">🗑️ apagar</button>
        </div>
      </div>`;
    }).join("");
  };

  watch(FB.query(FB.collection(DB,"eventos"),FB.orderBy("criadoEm","desc")),async snap=>{
    // só os eventos do dono logado (admin geral vê todos)
    const docs=snap.docs.filter(d=>{const o=d.data().ownerUid; return isAdminGeral()||!o||o===CURRENT_USER.uid;});
    allEv=await Promise.all(docs.map(async d=>({id:d.id,_d:d.data(),_cont:await contarEvento(d.id)})));
    // ordena pela data do evento (mais próximo primeiro); sem data vai pro fim
    allEv.sort((a,b)=>{const da=a._d.data||"",db=b._d.data||""; if(!da&&!db)return 0; if(!da)return 1; if(!db)return -1; return da>db?-1:da<db?1:0;});
    draw($("#evBusca")?$("#evBusca").value:"");
  });
  // busca (delegada porque o input persiste)
  setTimeout(()=>{const b=$("#evBusca"); if(b) b.oninput=e=>draw(e.target.value);},50);
}

async function contarEvento(evId){
  let total=0,f=0,m=0,o=0,checkin=0; const listas=[];
  const snap=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas"));
  for(const l of snap.docs){
    let lt=0;
    const cads=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",l.id,"cadastros"));
    cads.forEach(c=>{const x=c.data();total++;lt++;if(x.sex==="F")f++;else if(x.sex==="M")m++;else o++;if(x.checkin)checkin++;});
    listas.push({id:l.id, nome:l.data().nome||"Lista", valor:l.data().valor||0, qtd:lt});
  }
  listas.sort((a,b)=>(a.nome||"").localeCompare(b.nome||""));
  return {total,f,m,o,checkin,listas};
}

/* ====== editar/apagar EVENTO ====== */
async function editarEvento(evId){
  const s=await FB.getDoc(FB.doc(DB,"eventos",evId)); const e=s.data();
  openModal(`
    <h2>Editar evento</h2>
    <label>Nome</label><input id="meNome" value="${esc(e.nome)}">
    <label>Data</label><input id="meData" type="date" value="${e.data||''}">
    <label>Local</label><input id="meLocal" value="${esc(e.local||'')}">
    <label>Descrição</label><textarea id="meDesc" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'">${esc(e.descricao||'')}</textarea>
    <div class="row" style="margin-top:18px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="meSave">Salvar</button>
    </div>`);
  $("#meSave").onclick=async()=>{
    const nome=$("#meNome").value.trim(); if(!nome) return toast("Nome obrigatório");
    await FB.updateDoc(FB.doc(DB,"eventos",evId),{nome,data:$("#meData").value,local:$("#meLocal").value.trim(),descricao:$("#meDesc").value.trim()});
    closeModal(); toast("Evento atualizado ✅");
  };
}
async function apagarEvento(evId,nome){
  openConfirm(`Apagar o evento "<b>${esc(nome)}</b>" e TODAS as suas listas e cadastros? Isso não pode ser desfeito.`, async()=>{
    // apaga subcoleções
    const listas=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas"));
    for(const l of listas.docs){
      const cads=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",l.id,"cadastros"));
      for(const c of cads.docs) await FB.deleteDoc(FB.doc(DB,"eventos",evId,"listas",l.id,"cadastros",c.id));
      await FB.deleteDoc(FB.doc(DB,"eventos",evId,"listas",l.id));
    }
    await FB.deleteDoc(FB.doc(DB,"eventos",evId));
    closeModal(); toast("Evento apagado"); go({v:'admin'});
  });
}

/* =================== DETALHE DO EVENTO + LISTAS =================== */
async function renderEventoDetalhe(evId){
  const p=new URLSearchParams(location.search);
  if(p.get("lista")&&p.get("admin")) return renderListaAdmin(evId,p.get("lista"));
  renderSidebar("admin");
  const evSnap=await FB.getDoc(FB.doc(DB,"eventos",evId));
  if(!evSnap.exists()){app.innerHTML="evento não encontrado";return;}
  const ev=evSnap.data();
  app.innerHTML=`
    <button class="fab-back" onclick="go({v:'admin'})">← voltar aos eventos</button>
    <div class="card">
      <span class="pill pill-green">${fmtData(ev.data)}</span>
      <h1 style="font-size:24px;margin:10px 0 4px">${esc(ev.nome)}</h1>
      ${ev.local?`<div class="muted">📍 ${esc(ev.local)}</div>`:''}
      ${ev.descricao?`<p class="muted" style="margin-top:8px;white-space:pre-line">${esc(ev.descricao)}</p>`:''}
    </div>
    <div class="stat-grid" id="evTotais"></div>
    <div class="card">
      <h2 style="font-size:18px;margin-bottom:4px">Nova lista</h2>
      <p class="muted" style="margin-bottom:6px">Ex: Aniversário do Fulano, Convidados do Madalena…</p>
      <label>Nome da lista</label><input id="lNome" placeholder="Nome da lista">
      <div class="row" style="margin-top:6px">
        <div><label>Abre em (opcional)</label><input id="lIni" type="datetime-local"></div>
        <div><label>Fecha em (opcional)</label><input id="lFim" type="datetime-local"></div>
      </div>
      <div class="row" style="margin-top:6px">
        <div><label>Tipo</label>
          <select id="lTipo" onchange="document.getElementById('lValorWrap').style.display=this.value==='valor'?'block':'none'">
            <option value="off">Lista OFF (grátis)</option>
            <option value="valor">Lista com valor fixo</option>
          </select></div>
        <div id="lValorWrap" style="display:none"><label>Valor (R$)</label><input id="lValor" type="number" min="0" step="1" placeholder="Ex: 20"></div>
      </div>
      <div class="row" style="margin-top:6px;align-items:flex-end">
        <div><label>Limite de nomes</label><input id="lLim" type="number" min="0" placeholder="0 = ilimitado" value="0"></div>
        <div style="flex:0"><button class="btn btn-primary" id="lCriar">+ Criar lista</button></div>
      </div>
    </div>
    <h2 style="font-size:18px;margin:22px 0 12px">Listas deste evento</h2>
    <div id="listasWrap"><div class="loader">carregando…</div></div>`;

  $("#lCriar").onclick=async()=>{
    const nome=$("#lNome").value.trim(); if(!nome) return toast("Digite o nome da lista");
    const tipo=$("#lTipo").value; let valor=0;
    if(tipo==="valor"){valor=parseFloat($("#lValor").value)||0; if(valor<=0) return toast("Digite o valor da lista");}
    await FB.addDoc(FB.collection(DB,"eventos",evId,"listas"),{nome,inicio:$("#lIni").value||null,fim:$("#lFim").value||null,limite:parseInt($("#lLim").value)||0,valor,criadoEm:FB.serverTimestamp()});
    $("#lNome").value="";$("#lIni").value="";$("#lFim").value="";$("#lLim").value="0";$("#lTipo").value="off";$("#lValor").value="";$("#lValorWrap").style.display="none";
    toast("Lista criada! 🔗");
  };

  watch(FB.query(FB.collection(DB,"eventos",evId,"listas"),FB.orderBy("criadoEm","desc")),async snap=>{
    if(snap.empty){$("#listasWrap").innerHTML=`<div class="empty"><div class="ic">📝</div>Nenhuma lista. Crie a primeira!</div>`;$("#evTotais").innerHTML="";return;}
    let tot=0,fEv=0,mEv=0,oEv=0,inEv=0;
    const blocos=await Promise.all(snap.docs.map(async d=>{
      const L=d.data(); const link=`${baseUrl()}?ev=${evId}&lista=${d.id}`;
      const lim=L.limite>0?`limite ${L.limite}`:"ilimitada";
      const cads=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",d.id,"cadastros"));
      let t=0,f=0,m=0,o=0,ci=0; cads.forEach(c=>{const x=c.data();t++;if(x.sex==="F")f++;else if(x.sex==="M")m++;else o++;if(x.checkin)ci++;});
      tot+=t;fEv+=f;mEv+=m;oEv+=o;inEv+=ci;
      const vagas=L.limite>0?` / ${L.limite}`:"";
      return `<div class="card" style="margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <h3 style="flex:1;font-size:18px">${esc(L.nome)}</h3>
          ${L.valor>0?`<span class="pill pill-amber">${fmtBRL(L.valor)}</span>`:`<span class="pill pill-gray">OFF</span>`}
          <span class="pill pill-gray">${lim}</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px">
          <span class="pill pill-green">${t}${vagas} ${t===1?'pessoa':'pessoas'}</span>
          <span class="muted" style="font-size:13px">${f}♀ / ${m}♂${o?` / ${o}⚧`:''} · ${ci} entraram</span>
        </div>
        <div class="linkbox"><input readonly value="${link}" id="lk_${d.id}"><button class="btn btn-primary btn-sm" onclick="copyLink('lk_${d.id}')">copiar link</button></div>
        <div class="row" style="margin-top:12px">
          <button class="btn btn-primary btn-sm" onclick="go({ev:'${evId}',lista:'${d.id}',admin:'1'})">ver cadastros / relatório</button>
          <button class="btn btn-ghost btn-sm" onclick="editarLista('${evId}','${d.id}')">✏️ editar</button>
          <button class="btn btn-danger btn-sm" onclick="apagarLista('${evId}','${d.id}','${esc(L.nome).replace(/'/g,"\\'")}',${t})">🗑️ apagar</button>
        </div></div>`;
    }));
    $("#listasWrap").innerHTML=blocos.join("");
    $("#evTotais").innerHTML=`
      <div class="stat"><div class="n">${tot}</div><div class="l">total no evento</div></div>
      <div class="stat"><div class="n">${fEv}</div><div class="l">feminino</div></div>
      <div class="stat"><div class="n">${mEv}</div><div class="l">masculino</div></div>
      <div class="stat"><div class="n">${inEv}</div><div class="l">já entraram</div></div>`;
  });
}
window.copyLink=(id)=>{const i=document.getElementById(id);i.select();navigator.clipboard.writeText(i.value);toast("Link copiado! 📋");};
window.copyLinkVal=(url)=>{navigator.clipboard.writeText(url).then(()=>toast("Link copiado! 📋")).catch(()=>{const t=document.createElement("textarea");t.value=url;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast("Link copiado! 📋");}catch(e){toast("Não consegui copiar");}document.body.removeChild(t);});};

/* ====== editar/apagar LISTA ====== */
async function editarLista(evId,listaId){
  const s=await FB.getDoc(FB.doc(DB,"eventos",evId,"listas",listaId)); const L=s.data();
  openModal(`
    <h2>Editar lista</h2>
    <label>Nome da lista</label><input id="elNome" value="${esc(L.nome)}">
    <div class="row" style="margin-top:6px">
      <div><label>Abre em</label><input id="elIni" type="datetime-local" value="${L.inicio||''}"></div>
      <div><label>Fecha em</label><input id="elFim" type="datetime-local" value="${L.fim||''}"></div>
    </div>
    <div class="row" style="margin-top:6px">
      <div><label>Tipo</label>
        <select id="elTipo" onchange="document.getElementById('elValorWrap').style.display=this.value==='valor'?'block':'none'">
          <option value="off" ${!L.valor?'selected':''}>Lista OFF (grátis)</option>
          <option value="valor" ${L.valor>0?'selected':''}>Lista com valor fixo</option>
        </select></div>
      <div id="elValorWrap" style="display:${L.valor>0?'block':'none'}"><label>Valor (R$)</label><input id="elValor" type="number" min="0" step="1" value="${L.valor||''}"></div>
    </div>
    <label>Limite de nomes (0 = ilimitado)</label><input id="elLim" type="number" min="0" value="${L.limite||0}">
    <div class="row" style="margin-top:18px">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" id="elSave">Salvar</button>
    </div>`);
  $("#elSave").onclick=async()=>{
    const nome=$("#elNome").value.trim(); if(!nome) return toast("Nome obrigatório");
    let valor=0; if($("#elTipo").value==="valor"){valor=parseFloat($("#elValor").value)||0; if(valor<=0) return toast("Digite o valor");}
    await FB.updateDoc(FB.doc(DB,"eventos",evId,"listas",listaId),{nome,inicio:$("#elIni").value||null,fim:$("#elFim").value||null,valor,limite:parseInt($("#elLim").value)||0});
    closeModal(); toast("Lista atualizada ✅");
  };
}
async function apagarLista(evId,listaId,nome,qtd){
  openConfirm(`Apagar a lista "<b>${esc(nome)}</b>"${qtd>0?` com <b>${qtd}</b> cadastro(s)`:''}? Isso não pode ser desfeito.`, async()=>{
    const cads=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",listaId,"cadastros"));
    for(const c of cads.docs) await FB.deleteDoc(FB.doc(DB,"eventos",evId,"listas",listaId,"cadastros",c.id));

  app.innerHTML=`

    const f=filter.toLowerCase(); const arr=cache.filter(c=>(c.nomeLower||"").includes(f));

      ${c.checkin?`<button class="btn btn-ghost btn-sm" onclick="setCheck('${evId}','${c._lista}','${c.id}',false)">desfazer</button>`:`<button class="btn btn-green btn-sm" onclick="setCheck('${evId}','${c._lista}','${c.id}',true)">✓ entrou</button>`}</div>`;});
    $("#uList").innerHTML=h;
  };
  const refresh=async()=>{
    const todos=[];
    for(const l of listas.docs){const cads=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",l.id,"cadastros"));cads.forEach(d=>todos.push({id:d.id,_lista:l.id,_valor:l.data().valor||0,...d.data()}));}
    todos.sort((a,b)=>(a.nomeLower||"").localeCompare(b.nomeLower||"")); cache=todos;
    const total=todos.length,ins=todos.filter(x=>x.checkin).length,f=todos.filter(x=>x.sex==="F").length,m=todos.filter(x=>x.sex==="M").length;
    $("#ustats").innerHTML=`

  if(listas.empty){$("#uList").innerHTML=`<div class="empty"><div class="ic">📝</div>Sem listas neste evento.</div>`;$("#ustats").innerHTML="";}
  else listas.docs.forEach(l=>watch(FB.collection(DB,"eventos",evId,"listas",l.id,"cadastros"),()=>refresh()));
