<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getFirestore, collection, doc, addDoc, getDoc, getDocs, updateDoc,

<style>
:root{
  /* LISTA OFF — laranja (nomes --yellow mantidos p/ compatibilidade) */
  --yellow:#FF5C00;
  --yellow-soft:#FFE7D6;
  --yellow-tint:#FFF1E6;
  --ink:#120D08;
  --bg:#FFF8F2;
  --surface:#FFFFFF;
  --surface-2:#FFF3EA;
  --line:#F0E2D5;
  --muted:#8A7E72;
  --accent:#120D08;
  --danger:#E5433C;
  --warn:#C24E00;
  --radius:14px;
  --sidebar:248px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,system-ui,sans-serif;
  background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.4px}

/* ===== LAYOUT SHELL ===== */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);background:var(--ink);border-right:1px solid #1c1c1a;
  display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;
  transition:transform .25s;
}
.sidebar .brand{padding:24px 22px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #1f1f1d}
.sidebar .brand .mark{font-family:'Space Grotesk';font-weight:700;font-size:21px;color:#fff;letter-spacing:-.5px}
.sidebar .brand .mark .off{background:var(--yellow);color:var(--ink);padding:1px 9px;border-radius:7px;margin-left:5px}
.nav{padding:14px 12px;flex:1;display:flex;flex-direction:column;gap:4px}
.nav a{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;
  color:#9a9a90;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:.15s;
}
.nav a:hover{background:#1a1a18;color:#fff}
.nav a.active{background:var(--yellow);color:var(--ink);box-shadow:3px 3px 0 #000}
.nav a .ic{width:20px;text-align:center;font-size:16px}
.nav .sep{height:1px;background:#242422;margin:10px 6px}
.side-foot{padding:16px 18px;border-top:1px solid #1f1f1d;font-size:12px;color:#7a7a72}
.side-foot b{color:#e8e8e2;display:block;font-size:13px;margin-bottom:2px}

.main{flex:1;margin-left:var(--sidebar);min-width:0}
.topbar-m{display:none}
.content{max-width:1000px;margin:0 auto;padding:30px 28px 90px}
.page-title{font-size:30px;margin-bottom:22px;display:flex;align-items:center;gap:12px}

/* ===== COMPONENTES ===== */
.btn{border:2px solid var(--ink);border-radius:10px;padding:11px 19px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:8px;justify-content:center;box-shadow:3px 3px 0 var(--ink)}
.btn:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.btn-primary{background:var(--ink);color:var(--yellow)}
.btn-green{background:var(--yellow);color:var(--ink)}
.btn-ghost{background:var(--surface);color:var(--ink)}
.btn-danger{background:#fff;color:var(--danger)}
.btn-sm{padding:7px 13px;font-size:13px;box-shadow:2px 2px 0 var(--ink)}
.btn-sm:hover{box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.card{background:var(--surface);border-radius:var(--radius);padding:24px;margin-bottom:18px;border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}

input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;font-family:'Inter';font-size:15px;background:var(--surface);color:var(--ink);transition:.15s}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input::placeholder,textarea::placeholder{color:#b5b5ac}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:3px 3px 0 var(--yellow)}
label{font-weight:600;font-size:12px;display:block;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>div{flex:1;min-width:140px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;border:1.5px solid var(--ink)}
.pill-blue{background:var(--yellow-soft);color:#9a4500}
.pill-green{background:var(--ink);color:var(--yellow)}
.pill-gray{background:var(--surface-2);color:#5a5a52}

.ev-card .foot{display:flex;gap:8px;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface-2)}

.list-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:10px;border:2px solid var(--ink);margin-bottom:9px;background:var(--surface);transition:.12s;box-shadow:2px 2px 0 var(--ink)}
.list-row.in{background:var(--yellow-tint);border-color:#f0e08a}
.list-row .nm{font-weight:600;flex:1}
.list-row .wpp{font-size:13px;color:var(--muted)}
.sex-m{color:#3B82F6}.sex-f{color:#E0539B}.sex-o{color:var(--muted)}

.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:2px solid var(--ink);border-radius:10px;padding:8px 8px 8px 12px;margin-top:10px}
.linkbox input{border:none;background:transparent;font-size:13px;padding:4px;color:var(--ink);font-weight:500}
.linkbox input:focus{box-shadow:none}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--yellow);padding:13px 22px;border-radius:10px;font-weight:700;font-family:'Space Grotesk';font-size:14px;transition:.3s;z-index:999;box-shadow:0 10px 30px -8px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}

.fab-back{background:none;border:none;color:var(--muted);font-weight:600;cursor:pointer;font-size:14px;margin-bottom:16px;display:inline-flex;gap:6px;align-items:center}
.fab-back:hover{color:var(--ink)}
.loader{text-align:center;padding:40px;color:var(--muted)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}

/* ===== MODAL ===== */
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--surface);border:3px solid var(--ink);border-radius:16px;padding:26px;max-width:460px;width:100%;max-height:90vh;overflow:auto;box-shadow:6px 6px 0 var(--ink)}
.modal h2{font-size:22px;margin-bottom:4px}

/* ===== LANDING + PÚBLICO (vibe pista) ===== */
.landing-wrap{max-width:560px;margin:0 auto;padding:60px 24px}
.hero{text-align:center;margin-bottom:34px}
.hero .mark{font-family:'Space Grotesk';font-weight:700;font-size:46px;letter-spacing:-2px;color:var(--ink)}
.hero .mark .off{background:var(--yellow);color:var(--ink);padding:0 14px;border-radius:12px}
.hero p{color:var(--muted);margin-top:12px;font-size:16px}
.access-card{display:flex;align-items:center;gap:16px;padding:22px;border-radius:var(--radius);background:var(--surface);border:2px solid var(--ink);margin-bottom:16px;cursor:pointer;transition:.12s;text-align:left;width:100%;font-family:inherit;box-shadow:4px 4px 0 var(--ink)}
.access-card:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.access-card .ico{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:none;border:2px solid var(--ink)}
.access-card .ico.b{background:var(--yellow-tint)}
.access-card .ico.g{background:var(--yellow)}
.access-card .txt{flex:1}
.access-card .txt h3{font-size:18px;margin-bottom:2px}
.access-card .txt p{color:var(--muted);font-size:13px}
.access-card .arr{color:var(--ink);font-size:20px}
.admin-foot{text-align:center;margin-top:26px}
.admin-foot button{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;opacity:.6;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.admin-foot button:hover{opacity:1;color:var(--ink)}

.login-wrap{max-width:400px;margin:60px auto;padding:0 20px}

/* ===== PÚBLICO: tela preta "tá na lista" ===== */
body.pub-mode{background:var(--ink)}
body.pub-mode .sidebar,body.pub-mode .topbar-m,body.pub-mode .backdrop{display:none!important}
body.pub-mode .main{margin-left:0!important}
body.pub-mode .content{max-width:none;margin:0;padding:0}
.pub-stage{min-height:100vh;background:var(--ink);color:#fff;padding:0}
.pub-wrap{max-width:460px;margin:0 auto;padding:32px 22px 60px}
.pub-logo{font-family:'Space Grotesk';font-weight:700;color:var(--yellow);font-size:15px;letter-spacing:.5px;margin-bottom:38px}
.pub-ev{font-family:'Inter';font-size:12px;font-weight:600;color:#8a8a82;text-transform:uppercase;letter-spacing:.8px}
.pub-h1{font-family:'Space Grotesk';font-weight:700;font-size:clamp(34px,10vw,52px);line-height:.95;letter-spacing:-2px;color:#fff;margin:8px 0}
.pub-h1 .hl{background:var(--yellow);color:var(--ink);padding:0 10px;display:inline-block}
.pub-card{background:#141412;border:2px solid var(--yellow);border-radius:16px;padding:22px;margin-top:26px;box-shadow:6px 6px 0 var(--yellow)}
.pub-card label{color:#9a9a90}
.pub-card input,.pub-card select{background:#0e0e0c;border:2px solid #3a3a36;color:#fff}
.pub-card input::placeholder{color:#5a5a52}
.pub-card input:focus,.pub-card select:focus{border-color:var(--yellow);box-shadow:3px 3px 0 var(--yellow)}
.pub-done{background:var(--yellow);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:30px 22px;text-align:center;margin-top:26px;box-shadow:7px 7px 0 var(--ink)}
.pub-done h2{font-family:'Space Grotesk';font-size:30px;font-weight:700;letter-spacing:-1px}

/* ===== MOBILE ===== */
.menu-btn{display:none}
.backdrop{display:none}
@media(max-width:820px){
  .sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.3)}
  .sidebar.open{transform:translateX(0)}
  .main{margin-left:0}
  .topbar-m{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--ink);border-bottom:1px solid #1f1f1d;position:sticky;top:0;z-index:40}
  .topbar-m .mark{font-family:'Space Grotesk';font-weight:700;font-size:18px;color:#fff}
  .topbar-m .mark .off{background:var(--yellow);color:var(--ink);padding:1px 7px;border-radius:6px;margin-left:4px}
  .menu-btn{display:inline-flex;background:none;border:none;font-size:24px;cursor:pointer;color:#fff;line-height:1}
  .backdrop.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
  .content{padding:20px 16px 80px}
  .page-title{font-size:25px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
}

<body>
<div class="shell">
  <div class="backdrop" id="backdrop" onclick="toggleMenu(false)"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="mark">LISTA<span class="off">OFF</span></span></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <div class="topbar-m">
      <button class="menu-btn" onclick="toggleMenu(true)">☰</button>
      <span class="mark">LISTA<span class="off">OFF</span></span>
    </div>
    <div class="content" id="app"><div class="loader">carregando…</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>
<script>
/* =================== UTIL =================== */
const $ = s => document.querySelector(s);
const app = $("#app");
let DB, FB;

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function sexLabel(s){return s==="M"?"Masculino":s==="F"?"Feminino":"Outro";}
function sexClass(s){return s==="M"?"sex-m":s==="F"?"sex-f":"sex-o";}
function fmtBRL(v){return "R$ "+Number(v||0).toFixed(2).replace(".",",");}
function baseUrl(){return location.origin+location.pathname;}
function fmtData(d){return d?new Date(d+'T00:00').toLocaleDateString('pt-BR'):'sem data';}
function ordEvDocs(docs){return [...docs].sort((a,b)=>{const da=a.data().data||"",db=b.data().data||"";if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da>db?-1:da<db?1:0;});}

// senhas / whatsapp (definidos no topo do arquivo)
function toggleMenu(open){
  $("#sidebar").classList.toggle("open",open);
  $("#backdrop").classList.toggle("show",open);
}

/* =================== ROUTER =================== */
function route(){
  clearWatchers();
  if(window._clearListeners) window._clearListeners();
  toggleMenu(false);
  document.body.classList.remove("pub-mode");
  const p = new URLSearchParams(location.search);
  const v = p.get("v");
  // público (link de cadastro)
  if(p.get("lista") && !p.get("admin")) return renderPublic(p.get("ev"), p.get("lista"));
  if(v==="portaria") return guardPortaria();
  if(v==="parceiro") return renderParceiro();
  if(v==="login") return renderLogin();
  if(v==="geral") return guardAdmin(()=>renderAdminGeral());
  if(v==="painel"||v==="admin"||v==="banco"||v==="relatorios" || (p.get("ev")&&!p.get("lista"))) return guardAdmin();
  return renderLanding();
}
function go(params){
  const u=new URL(location.href); u.search=new URLSearchParams(params).toString();
  history.pushState({},"",u); route();
}
window.addEventListener("popstate", route);
window.go=go; window.toggleMenu=toggleMenu;

/* ---- gerenciador de listeners (desinscreve ao trocar de tela) ---- */
let _watchers=[];
function watch(ref, cb){ const unsub=FB.onSnapshot(ref, cb); _watchers.push(unsub); return unsub; }
function clearWatchers(){ _watchers.forEach(u=>{try{u&&u()}catch(e){}}); _watchers=[]; }

/* =================== FIREBASE READY =================== */
let AUTH, CURRENT_USER=null, CURRENT_CONTA=null, _authReady=false;
function isAdminGeral(){ return CURRENT_USER && CURRENT_USER.email && CURRENT_USER.email.toLowerCase()===ADMIN_GERAL.toLowerCase(); }
function onFbReady(){
  FB=window._fb; DB=FB.db; AUTH=window._auth;
  if(firebaseConfig.apiKey==="COLE_AQUI"){
    document.querySelector(".shell").innerHTML=`<div class="content"><div class="card center"><h2>⚠️ Falta configurar o Firebase</h2><p class="muted" style="margin-top:8px">Cole a config do seu projeto Firebase no topo do arquivo (bloco PASSO 1) e suba de novo.</p></div></div>`;
    return;
  }
  // observa login/logout do dono
  AUTH.onAuthStateChanged(AUTH.auth, async(user)=>{
    CURRENT_USER=user||null; CURRENT_CONTA=null;
    if(user){
      // garante doc da conta
      const ref=FB.doc(DB,"contas",user.uid);
      const snap=await FB.getDoc(ref);
      if(!snap.exists()){
        await FB.setDoc(ref,{email:user.email,nome:user.displayName||"",creditos:0,gratis:false,criadoEm:FB.serverTimestamp()});
        CURRENT_CONTA={email:user.email,nome:user.displayName||"",creditos:0,gratis:false};
      } else CURRENT_CONTA=snap.data();
    }
    _authReady=true;
    route();
  });
}
// recarrega a conta do dono (saldo de créditos etc.)
async function reloadConta(){
  if(!CURRENT_USER) return;
  const snap=await FB.getDoc(FB.doc(DB,"contas",CURRENT_USER.uid));
  if(snap.exists()) CURRENT_CONTA=snap.data();
}
window.addEventListener("fb-ready", ()=>{ window._readyFired=true; });
// roda o app só quando a página inteira (todos os scripts) terminou de carregar
function bootApp(){ if(window._fb && (window._readyFired||window._fbReady)) onFbReady(); else setTimeout(bootApp,30); }
if(document.readyState==="complete") bootApp();
else window.addEventListener("load", bootApp);

/* =================== SIDEBAR =================== */
function renderSidebar(active){
  const items=[
    {k:"admin",   ic:"📅", label:"Eventos"},
    {k:"portaria",ic:"🎟️", label:"Portaria"},
    {k:"banco",   ic:"📇", label:"Banco de Dados"},
    {k:"relatorios",ic:"📊",label:"Relatórios"},
    {k:"painel",  ic:"💳", label:"Créditos"},
  ];
  if(isAdminGeral()) items.push({k:"geral",ic:"👑",label:"Admin Geral"});
  $("#nav").innerHTML = items.map(i=>
    `<a class="${active===i.k?'active':''}" onclick="go({v:'${i.k}'})"><span class="ic">${i.ic}</span>${i.label}</a>`
  ).join("") + `<div class="sep"></div>

/* =================== LOGIN / CADASTRO DO DONO (Firebase Auth) =================== */
function renderLogin(){
  if(!_authReady){ app.innerHTML=`<div class="loader">carregando…</div>`; return; }
  if(CURRENT_USER){ showShell(true); return go({v:'admin'}); }
  showShell(false);
  let modo="login"; // ou "cadastro"
  const draw=()=>{
    app.innerHTML=`<div class="login-wrap">
      <button class="fab-back" onclick="go({})">← voltar</button>
      <div class="card">
        <div style="font-family:'Space Grotesk';font-weight:700;font-size:26px;margin-bottom:2px">LISTA<span style="background:var(--yellow);border:2px solid var(--ink);padding:0 7px;border-radius:7px;margin-left:5px;box-shadow:2px 2px 0 var(--ink)">OFF</span></div>
        <p class="muted" style="margin-bottom:14px">${modo==="login"?"Entre pra gerenciar seus rolês.":"Crie sua conta e comece a usar."}</p>
        ${modo==="cadastro"?`<label>Seu nome</label><input id="auNome" placeholder="Nome completo" autocomplete="name">`:""}
        <label>E-mail</label><input id="auEmail" type="email" placeholder="voce@email.com" autocomplete="email">
        <label>Senha</label><input id="auPw" type="password" placeholder="${modo==="cadastro"?"crie uma senha (mín. 6)":"sua senha"}" autocomplete="${modo==="cadastro"?"new-password":"current-password"}">
        <button class="btn btn-primary" style="width:100%;margin-top:18px" id="auBtn">${modo==="login"?"Entrar":"Criar conta →"}</button>
        ${modo==="login"?`<button class="fab-back" style="margin:14px 0 0" id="auReset">esqueci a senha</button>`:""}
        <div style="text-align:center;margin-top:16px;font-size:14px;color:var(--muted)">
          ${modo==="login"?`Não tem conta? <a style="color:var(--ink);font-weight:700;cursor:pointer" id="auSwap">Criar agora</a>`:`Já tem conta? <a style="color:var(--ink);font-weight:700;cursor:pointer" id="auSwap">Entrar</a>`}
        </div>
      </div></div>`;
    $("#auSwap").onclick=()=>{modo=modo==="login"?"cadastro":"login";draw();};
    const submit=async()=>{
      const email=($("#auEmail").value||"").trim(), pw=$("#auPw").value||"";
      if(!email||!email.includes("@")) return toast("Digite um e-mail válido");
      if(pw.length<6) return toast("Senha de no mínimo 6 caracteres");
      $("#auBtn").disabled=true; $("#auBtn").textContent="…";
      try{
        if(modo==="cadastro"){
          const nome=($("#auNome").value||"").trim();
          if(nome.length<2){$("#auBtn").disabled=false;$("#auBtn").textContent="Criar conta →";return toast("Digite seu nome");}
          const cred=await AUTH.createUserWithEmailAndPassword(AUTH.auth,email,pw);
          try{ await AUTH.updateProfile(cred.user,{displayName:nome}); }catch(e){}
          toast("Conta criada! 🎉");
          // onAuthStateChanged cuida do resto (cria doc e redireciona)
        }else{
          await AUTH.signInWithEmailAndPassword(AUTH.auth,email,pw);
          toast("Bem-vindo de volta 👋");
        }
        go({v:'admin'});
      }catch(e){
        $("#auBtn").disabled=false; $("#auBtn").textContent=modo==="login"?"Entrar":"Criar conta →";
        toast(authErro(e));
      }
    };
    $("#auBtn").onclick=submit;
    $("#auPw").addEventListener("keydown",e=>{if(e.key==="Enter")submit();});
    const r=$("#auReset"); if(r) r.onclick=async()=>{
      const email=($("#auEmail").value||"").trim(); if(!email) return toast("Digite seu e-mail primeiro");
      try{ await AUTH.sendPasswordResetEmail(AUTH.auth,email); toast("Enviamos um link de recuperação pro seu e-mail"); }
      catch(e){ toast(authErro(e)); }
    };
  };
  draw();
}
function authErro(e){
  const c=(e&&e.code)||"";
  if(c.includes("email-already-in-use")) return "Esse e-mail já tem conta. Faça login.";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found")) return "E-mail ou senha incorretos";
  if(c.includes("weak-password")) return "Senha muito fraca (mín. 6)";
  if(c.includes("invalid-email")) return "E-mail inválido";
  if(c.includes("too-many-requests")) return "Muitas tentativas. Tente mais tarde.";
  if(c.includes("network")) return "Sem conexão. Verifique a internet.";
  return "Erro: "+(e&&e.message||"tente de novo");
}

window.comprarCredito=async(pacoteId)=>{

function renderEventos(){

  let allEv=[];

async function contarEvento(evId){
  let total=0,f=0,m=0,o=0,checkin=0;
  const listas=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas"));
  for(const l of listas.docs){
    const cads=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",l.id,"cadastros"));
    cads.forEach(c=>{const x=c.data();total++;if(x.sex==="F")f++;else if(x.sex==="M")m++;else o++;if(x.checkin)checkin++;});
  }
  return {total,f,m,o,checkin};
}

async function apagarEvento(evId,nome){
  openConfirm(`Apagar o evento "<b>${esc(nome)}</b>" e TODAS as suas listas e cadastros? Isso não pode ser desfeito.`, async()=>{

function dl(content,filename){const b=new Blob(["\ufeff"+content],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;a.click();}

    arr.forEach(c=>{h+=`<div class="list-row ${c.checkin?'in':''}">
      <span class="${sexClass(c.sex)}">${c.sex==="F"?"♀":c.sex==="M"?"♂":"⚧"}</span>
      <div style="flex:1"><div class="nm">${esc(c.nome)}</div><div class="wpp">${esc(c.wpp)} · <b style="color:var(--blue)">${esc(nomeLista[c._lista]||"")}</b>${c._valor>0?` · ${fmtBRL(c._valor)}`:''}</div></div>
      ${c.checkin?`<button class="btn btn-ghost btn-sm" onclick="setCheck('${evId}','${c._lista}','${c.id}',false)">desfazer</button>`:`<button class="btn btn-green btn-sm" onclick="setCheck('${evId}','${c._lista}','${c.id}',true)">✓ entrou</button>`}</div>`;});
    $("#uList").innerHTML=h;
  };
  const refresh=async()=>{
    const todos=[];
    for(const l of listas.docs){const cads=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",l.id,"cadastros"));cads.forEach(d=>todos.push({id:d.id,_lista:l.id,_valor:l.data().valor||0,...d.data()}));}
    todos.sort((a,b)=>(a.nomeLower||"").localeCompare(b.nomeLower||"")); cache=todos;
    const total=todos.length,ins=todos.filter(x=>x.checkin).length,f=todos.filter(x=>x.sex==="F").length,m=todos.filter(x=>x.sex==="M").length;
    $("#ustats").innerHTML=`
      <div class="stat"><div class="n">${ins}</div><div class="l">entraram</div></div>
      <div class="stat"><div class="n">${total-ins}</div><div class="l">faltam</div></div>
      <div class="stat"><div class="n">${f}</div><div class="l">fem</div></div>
      <div class="stat"><div class="n">${m}</div><div class="l">masc</div></div>`;
    draw($("#uSearch").value);
  };
  if(listas.empty){$("#uList").innerHTML=`<div class="empty"><div class="ic">📝</div>Sem listas neste evento.</div>`;$("#ustats").innerHTML="";}
  else listas.docs.forEach(l=>watch(FB.collection(DB,"eventos",evId,"listas",l.id,"cadastros"),()=>refresh()));
  $("#uSearch").oninput=e=>draw(e.target.value);
}
async function renderPortariaLista(evId,listaId){
  renderSidebar("portaria");
  const lSnap=await FB.getDoc(FB.doc(DB,"eventos",evId,"listas",listaId)); const L=lSnap.data();
  app.innerHTML=`
    <button class="fab-back" onclick="go({v:'portaria'})">← trocar lista</button>
    <h1 style="font-size:24px">${esc(L.nome)}</h1>
    ${L.valor>0?`<span class="pill pill-amber">Cobrar ${fmtBRL(L.valor)} de cada pessoa</span>`:`<span class="pill pill-gray">Lista OFF · grátis</span>`}
    <div class="stat-grid" id="pstats" style="margin:14px 0"></div>
    <div class="search-box" style="margin-bottom:14px"><input id="pSearch" placeholder="buscar nome…" autofocus></div>
    <div id="pList"><div class="loader">carregando…</div></div>`;
  let cache=[];
  const draw=(filter="")=>{
    const f=filter.toLowerCase(); const arr=cache.filter(c=>(c.nomeLower||"").includes(f));
    let h=""; if(!arr.length)h=`<div class="empty"><div class="ic">🔍</div>Nenhum nome encontrado.</div>`;
    arr.forEach(c=>{h+=`<div class="list-row ${c.checkin?'in':''}">
      <span class="${sexClass(c.sex)}">${c.sex==="F"?"♀":c.sex==="M"?"♂":"⚧"}</span>
      <div style="flex:1"><div class="nm">${esc(c.nome)}</div><div class="wpp">${esc(c.wpp)}</div></div>
      ${c.checkin?`<button class="btn btn-ghost btn-sm" onclick="setCheck('${evId}','${listaId}','${c.id}',false)">desfazer</button>`:`<button class="btn btn-green btn-sm" onclick="setCheck('${evId}','${listaId}','${c.id}',true)">✓ entrou</button>`}</div>`;});
    $("#pList").innerHTML=h;
  };
  watch(FB.collection(DB,"eventos",evId,"listas",listaId,"cadastros"),snap=>{
    cache=[];snap.forEach(d=>cache.push({id:d.id,...d.data()}));
    cache.sort((a,b)=>(a.nomeLower||"").localeCompare(b.nomeLower||""));
    const total=cache.length,ins=cache.filter(x=>x.checkin).length;
    $("#pstats").innerHTML=`
      <div class="stat"><div class="n">${ins}</div><div class="l">entraram</div></div>
      <div class="stat"><div class="n">${total-ins}</div><div class="l">faltam</div></div>
      <div class="stat"><div class="n">${total}</div><div class="l">total</div></div>`;
    draw($("#pSearch").value);
  });
  $("#pSearch").oninput=e=>draw(e.target.value);
}
window.setCheck=async(evId,listaId,cadId,val)=>{await FB.updateDoc(FB.doc(DB,"eventos",evId,"listas",listaId,"cadastros",cadId),{checkin:val});};

/* =================== PÁGINA PÚBLICA =================== */
async function renderPublic(evId,listaId){
  showShell(false);
  document.body.classList.add("pub-mode");
  app.innerHTML=`<div class="pub-stage"><div class="pub-wrap"><div class="loader" style="color:#8a8a82">carregando…</div></div></div>`;
  try{
    const evSnap=await FB.getDoc(FB.doc(DB,"eventos",evId));
    const lSnap=await FB.getDoc(FB.doc(DB,"eventos",evId,"listas",listaId));
    if(!evSnap.exists()||!lSnap.exists()){app.innerHTML=pub(`<h1 class="pub-h1">Lista não<br>encontrada</h1>`);return;}
    const ev=evSnap.data(),L=lSnap.data();
    const now=Date.now(),ini=L.inicio?new Date(L.inicio).getTime():null,fim=L.fim?new Date(L.fim).getTime():null;
    if(ini&&now<ini){app.innerHTML=pub(`<h1 class="pub-h1">Calma,<br><span class="hl">ainda não abriu</span></h1><p style="color:#9a9a90;margin-top:14px">Abre em ${fmtDT(L.inicio)}</p>`);return;}
    if(fim&&now>fim){app.innerHTML=pub(`<h1 class="pub-h1">Lista<br><span class="hl">encerrada</span></h1><p style="color:#9a9a90;margin-top:14px">Fechou em ${fmtDT(L.fim)}</p>`);return;}
    if(L.limite&&L.limite>0){const c=await FB.getDocs(FB.collection(DB,"eventos",evId,"listas",listaId,"cadastros"));if(c.size>=L.limite){app.innerHTML=pub(`<h1 class="pub-h1">Lotou!<br><span class="hl">deu ruim</span></h1><p style="color:#9a9a90;margin-top:14px">Todas as vagas foram preenchidas.</p>`);return;}}
    app.innerHTML=`<div class="pub-stage"><div class="pub-wrap">
      <div class="pub-logo">LISTA OFF</div>
      <div class="pub-ev">${esc(ev.nome)}${ev.data?` · ${fmtData(ev.data)}`:''}</div>
      <h1 class="pub-h1">${esc(L.nome)}</h1>
      <div style="margin-top:14px">
        ${L.valor>0?`<span class="pill pill-amber">Entrada ${fmtBRL(L.valor)} · paga na portaria</span>`:`<span class="pill" style="background:#1c1c1a;color:#9a9a90">Entrada grátis</span>`}
      </div>
      ${ev.local?`<p style="color:#9a9a90;margin-top:12px;font-size:14px">📍 ${esc(ev.local)}</p>`:''}
      ${ev.descricao?`<p style="color:#9a9a90;margin-top:6px;font-size:14px;white-space:pre-line">${esc(ev.descricao)}</p>`:''}
      <div class="pub-card" id="formCard">
        <h2 style="font-family:'Space Grotesk';font-size:18px;color:#fff;margin-bottom:10px">Bota teu nome na lista</h2>
        <label>Nome completo</label><input id="pNome" placeholder="Seu nome completo" autocomplete="name">
        <label>WhatsApp (com DDD)</label><input id="pWpp" placeholder="(38) 9 9999-9999" inputmode="tel">
        <label>Sexo</label><select id="pSex"><option value="">Selecione…</option><option value="F">Feminino</option><option value="M">Masculino</option><option value="O">Outro</option></select>
        <button class="btn btn-green" style="width:100%;margin-top:20px" id="pSend">Bora, tô dentro →</button>
      </div></div></div>`;
    $("#pSend").onclick=async()=>{
      const nome=$("#pNome").value.trim(),wpp=$("#pWpp").value.trim(),sex=$("#pSex").value;
      if(nome.length<3) return toast("Digite seu nome completo");
      if(wpp.replace(/\D/g,"").length<10) return toast("WhatsApp inválido");
      if(!sex) return toast("Selecione o sexo");
      $("#pSend").disabled=true;$("#pSend").textContent="enviando…";
      try{
        await FB.addDoc(FB.collection(DB,"eventos",evId,"listas",listaId,"cadastros"),{nome,nomeLower:nome.toLowerCase(),wpp,sex,checkin:false,criadoEm:FB.serverTimestamp()});
        const primeiro=esc(nome.split(" ")[0]);
        $("#formCard").outerHTML=`<div class="pub-done">
          <h2>CÊ TÁ NA LISTA ✅</h2>
          ${L.valor>0?`<p style="font-family:'Space Grotesk';font-weight:700;font-size:18px;margin-top:8px">Paga ${fmtBRL(L.valor)} na portaria</p><p style="margin-top:6px;font-size:14px">${primeiro}, é só chegar, falar seu nome e pagar na entrada.</p>`:`<p style="margin-top:8px;font-size:14px">${primeiro}, é só chegar e falar seu nome na portaria.</p>`}
          <div style="margin-top:16px;font-size:13px;font-weight:600;opacity:.7">${esc(ev.nome)} · ${esc(L.nome)}</div></div>`;
      }catch(e){console.error(e);toast("Erro ao enviar, tente de novo");$("#pSend").disabled=false;$("#pSend").textContent="Bora, tô dentro →";}
    };
  }catch(e){console.error(e);app.innerHTML=pub(`<h1 class="pub-h1">Erro ao<br>carregar</h1><p style="color:#9a9a90;margin-top:14px">${esc(e.message)}</p>`);}
}
function pub(html){document.body.classList.add("pub-mode");return `<div class="pub-stage"><div class="pub-wrap"><div class="pub-logo">LISTA OFF</div>${html}</div></div>`;}
function fmtDT(d){if(!d)return"";return new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}

/* =================== MODAL HELPERS =================== */
function openModal(html){$("#modalRoot").innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;}
function closeModal(){$("#modalRoot").innerHTML="";}
function openConfirm(html,onYes){
  openModal(`<h2>Confirmar</h2><p class="muted" style="margin:8px 0 4px">${html}</p>
    <div class="row" style="margin-top:18px"><button class="btn btn-ghost" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" id="cfYes">Apagar</button></div>`);
  $("#cfYes").onclick=onYes;
}
window.editarEvento=editarEvento;window.apagarEvento=apagarEvento;
window.editarLista=editarLista;window.apagarLista=apagarLista;
window.closeModal=closeModal;
window.renderLogin=renderLogin;window.renderPainel=renderPainel;window.renderAdminGeral=renderAdminGeral;
</script>
